services:
  crypto-tracker-db:
    container_name: crypto-tracker-db
    image: postgres:14.2-alpine3.15
    user: root
    environment:
      POSTGRES_DB: cryptotracker-db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - '6632:5432'
    volumes:
      - crypto-tracker-db_data:/var/lib/postgresql/data
      - crypto-tracker-db_dump:/docker-entrypoint-initdb.d/
    restart: on-failure

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    user: root
    environment:
      PGADMIN_DEFAULT_EMAIL: mail@mail.com
      PGADMIN_DEFAULT_PASSWORD: mysecretpassword
      PGADMIN_LISTEN_PORT: 8080
    volumes:
      - crypto-tracker-db_pgadmin:/var/lib/pgadmin
    ports:
      - '6680:8080'
    depends_on:
      - crypto-tracker-db
    restart: unless-stopped

  vault:
    container_name: cryptotracker-vault
    image: hashicorp/vault:latest
    entrypoint:
      - vault
      - server
      - -dev
      - -dev-root-token-id=dev-token
      - -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DISABLE_MLOCK: 'true'
    ports:
      - '8200:8200'
    healthcheck:
      test: ['CMD', 'vault', 'status', '-address=http://127.0.0.1:8200']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vault-init:
    container_name: cryptotracker-vault-init
    image: curlimages/curl:8.8.0
    depends_on:
      vault:
        condition: service_healthy
    env_file:
      - ../../../../.env
    environment:
      VAULT_ADDR: http://vault:8200
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        VAULT_TOKEN="$${VAULT_TOKEN:-dev-token}"
        CRYPTO_API_URL="$${CRYPTO_API_URL:-https://pro-api.coinmarketcap.com}"
        until curl -sf "$$VAULT_ADDR/v1/sys/health" >/dev/null; do sleep 1; done
        if [ -z "$$CRYPTO_API_KEY" ]; then echo "CRYPTO_API_KEY is empty"; exit 1; fi
        curl -sf -X POST "$$VAULT_ADDR/v1/secret/data/crypto-tracker" \
          -H "X-Vault-Token: $$VAULT_TOKEN" \
          -H "Content-Type: application/json" \
          --data "{\"data\":{\"crypto-api.url\":\"$$CRYPTO_API_URL\",\"crypto-api.key\":\"$$CRYPTO_API_KEY\"}}"
        echo "Vault secrets loaded"
    restart: "no"

volumes:
  crypto-tracker-db_data:
  crypto-tracker-db_dump:
  crypto-tracker-db_pgadmin:
