name: Branch Others workflow

on:
  push:
    branches-ignore:
      - develop
      - master

permissions:
  actions: write
jobs:
  buildAndSonar:
    name: Build-app
    uses: ./.github/workflows/build.yml
    secrets: inherit

  build-docker-branch:
    name: Build-docker-branch
    needs: [ buildAndSonar ]
    uses: ./.github/workflows/build-docker.yml
    with:
      version: 'false'
    secrets: inherit
